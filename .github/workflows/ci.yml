name: CI Build & Test Pipeline
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Test and package backend
        working-directory: omnispace/backend
        run: mvn --batch-mode verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: omnispace/backend/target/surefire-reports
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: omnispace/frontend/package-lock.json
      - name: Install frontend
        working-directory: omnispace/frontend
        run: npm ci --legacy-peer-deps
      - name: Run frontend regression tests
        working-directory: omnispace/frontend
        run: npm test -- --watch=false
      - name: Test server-side API gateway
        working-directory: omnispace/frontend
        run: node --test tools/gateway.test.mjs
      - name: Build production frontend
        working-directory: omnispace/frontend
        run: npm run build -- --configuration production

  deploy-vps:
    name: Deploy backend to OCI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    concurrency:
      group: omnispace-oci-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Build and deploy tested revision
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST in the production environment}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY in the production environment}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS in the production environment}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 "opc@$VPS_HOST" "bash -s -- $GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          revision=$1
          cd "$HOME/omnispace-deploy"

          git -C repo fetch --no-tags origin main
          if [[ "$(git -C repo rev-parse FETCH_HEAD)" != "$revision" ]]; then
            echo "A newer revision is on main. Skipping $revision."
            exit 0
          fi

          build_dir=$(mktemp -d)
          trap 'rm -rf -- "$build_dir"' EXIT
          git -C repo archive "$revision" omnispace/backend | tar -x -C "$build_dir"

          image=omnispace-deploy-backend
          previous_image=$(sudo -n docker compose images -q backend | head -n 1)
          sudo -n docker build --tag "$image" "$build_dir/omnispace/backend"
          sudo -n docker compose up -d --no-deps --no-build backend

          for attempt in {1..30}; do
            if git -C repo show "$revision:infra/check-backend.py" | python3 -; then
              echo "Backend deployed at $revision"
              exit 0
            fi
            sleep 2
          done

          sudo -n docker compose logs --tail=60 backend
          if [[ -n "$previous_image" ]]; then
            sudo -n docker tag "$previous_image" "$image"
            sudo -n docker compose up -d --no-deps --no-build --force-recreate backend
          fi
          exit 1
          REMOTE
