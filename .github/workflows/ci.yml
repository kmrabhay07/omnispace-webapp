name: CI Build & Test Pipeline
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Test and package backend
        working-directory: omnispace/backend
        run: mvn --batch-mode verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: omnispace/backend/target/surefire-reports
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: omnispace/frontend/package-lock.json
      - name: Install frontend
        working-directory: omnispace/frontend
        run: npm ci --legacy-peer-deps
      - name: Run frontend regression tests
        working-directory: omnispace/frontend
        run: npm test -- --watch=false
      - name: Build production frontend
        working-directory: omnispace/frontend
        run: npm run build -- --configuration production
