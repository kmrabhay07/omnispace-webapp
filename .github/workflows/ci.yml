name: CI Build & Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend
        run: |
          cd omnispace/backend
          mvn clean package -DskipTests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_dummy_jwt_secret_for_github_actions_build_pipeline_123456' }}
          MONGO_DB_URI: ${{ secrets.MONGO_DB_URI || 'mongodb://localhost:27017/omnispace_ci' }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'omnispace/frontend/package-lock.json'

      - name: Install & Build Angular SPA
        run: |
          cd omnispace/frontend
          npm ci --legacy-peer-deps
          npx ng build --configuration production
