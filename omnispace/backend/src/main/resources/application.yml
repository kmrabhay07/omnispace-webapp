server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: omnispace-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:${MONGO_DB_URI:${MONGO_URI:mongodb://localhost:27017/omnispace}}}}

app:
  proxy:
    required: ${ORIGIN_PROXY_REQUIRED:false}
    secret: ${OMNISPACE_PROXY_SECRET:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,https://omnispace-webapp-x3xh.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.omnispace: INFO
    org.springframework.data.mongodb: WARN
