server:
  port: ${PORT:8080}

spring:
  application:
    name: omnispace-backend
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:${MONGO_DB_URI:${MONGO_URI:mongodb://localhost:27017/omnispace}}}}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,https://omnispace-webapp-x3xh.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

logging:
  file:
    name: ${OMNISPACE_LOG_FILE:}
  logback:
    rollingpolicy:
      file-name-pattern: "${OMNISPACE_LOG_FILE:omnispace.log}.%d{yyyy-MM-dd_HH,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 23
      total-size-cap: 250MB
      clean-history-on-start: true
  level:
    root: INFO
    com.omnispace: INFO
    org.springframework.data.mongodb: WARN
